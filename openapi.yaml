openapi: 3.0.3
info:
  title: M321 Hello Service API
  description: Contract for the hello operation shared by the two M321 services.
  version: 2.0.0
servers:
  - url: http://localhost:8081
    description: Noah service (local)
paths:
  /api/hello:
    get:
      operationId: getHello
      summary: Return the service greeting
      responses:
        '200':
          description: Greeting returned successfully
          content:
            text/plain:
              schema:
                type: string
              example: Hello from Service Noah
