openapi: 3.0.3
info:
  title: M321 Hello Service API
  description: Version 1, retained only to demonstrate the breaking change.
  version: 1.0.0
paths:
  /hello:
    get:
      operationId: getHello
      summary: Return the service greeting
      responses:
        '200':
          description: Greeting returned successfully
          content:
            text/plain:
              schema:
                type: string
              example: Hello from Service Noah
